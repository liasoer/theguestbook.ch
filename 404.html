<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seite nicht gefunden | The Guestbook</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#4A0F14">
<style>
@font-face{font-family:"Cinzel";src:url("/fonts/cinzel.woff2") format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Corinthia";src:url("/fonts/corinthia-bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url("/fonts/newsreader.woff2") format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url("/fonts/newsreader-italic.woff2") format("woff2");font-weight:300 700;font-style:italic;font-display:swap}
</style>
<style>
:root{--bordeaux:#4A0F14;--wein:#7A1F28;--papier:#EEE6D6;--tinte:#26140F;--muted:#6B5A50}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papier);color:var(--tinte)}
body{display:flex;align-items:center;justify-content:center;padding:32px;font-family:"Newsreader",Georgia,serif;text-align:center}
main{max-width:520px}
img{width:min(80vw,360px);height:auto;display:block;margin:0 auto 40px}
h1{font-family:"Cinzel","Trajan Pro",Georgia,serif;font-weight:500;font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0 0 16px}
p{font-style:italic;color:var(--muted);font-size:18px;line-height:1.6;margin:0 0 32px}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:12px 26px;border:1px solid var(--wein);border-radius:2px;color:var(--wein);text-decoration:none;font-size:16px}
a.btn:hover{background:var(--wein);color:var(--papier)}
a:focus-visible{outline:2px solid var(--wein);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logo-filmstreifen.svg" alt="The Guestbook">
  <h1>Diese Szene gibt es nicht</h1>
  <p>Die Seite wurde verschoben oder existiert nicht mehr.</p>
  <a class="btn" href="/">Zur Startseite</a>
</main>
</body>
</html>
